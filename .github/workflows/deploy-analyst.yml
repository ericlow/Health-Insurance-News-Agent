name: Deploy Analyst Lambda

on:
  push:
    branches: [main]
    paths:
      - 'agent/analyst/**'
      - 'agent/__init__.py'
      - 'agent/http_utils.py'
      - 'docs/regulatory-rules.md'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install PyNaCl anthropic psycopg2-binary requests beautifulsoup4 lxml \
            --target ./package \
            --platform manylinux2014_x86_64 --python-version 3.12 --only-binary :all:

      - name: Package
        run: |
          mkdir -p package/agent/analyst/tools
          mkdir -p package/docs
          cp agent/__init__.py agent/http_utils.py package/agent/
          cp agent/analyst/__init__.py agent/analyst/interactions.py \
             agent/analyst/engine.py agent/analyst/persistence.py \
             agent/analyst/discord.py package/agent/analyst/
          cp agent/analyst/tools/__init__.py agent/analyst/tools/fetch_url.py \
             agent/analyst/tools/lookup_regulatory_rules.py \
             agent/analyst/tools/search_web.py package/agent/analyst/tools/
          cp docs/regulatory-rules.md package/docs/regulatory-rules.md
          cd package && zip -r ../analyst.zip .

      - name: Deploy
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-west-1
        run: |
          aws lambda update-function-code \
            --function-name analyst-handler \
            --zip-file fileb://analyst.zip
