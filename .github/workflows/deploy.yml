name: Deploy to Lambda

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          grep -vE "^(playwright|boto3|responses|pytest|claude-pyrojects)" requirements.txt \
            | pip install -r /dev/stdin --target ./package \
            --platform manylinux2014_x86_64 --python-version 3.12 --only-binary :all:

      - name: Package
        run: |
          cp -r agent db config.py scheduler.py ./package/
          cd package && zip -r ../deployment.zip .

      - name: Deploy
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-west-1
        run: |
          aws s3 cp deployment.zip s3://health-insurance-monitor-deploy/deployment.zip
          aws lambda update-function-code \
            --function-name health-insurance-monitor \
            --s3-bucket health-insurance-monitor-deploy \
            --s3-key deployment.zip
